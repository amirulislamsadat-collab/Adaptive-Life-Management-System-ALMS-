name: Build desktop & mobile apps

# Builds a real Windows installer (Electron) and Android APK (Capacitor) and
# attaches them to a GitHub Release. Runs on any tag push (v1.0.0 etc.) or
# can be triggered manually from the Actions tab.
#
# Both apps are thin wrappers around the live deployed site (see
# desktop-app/README.md), so before tagging a release, set the
# ALMS_APP_URL repository variable (Settings -> Secrets and variables ->
# Actions -> Variables) to your real Vercel URL, e.g.
# https://your-app.vercel.app. Every future tagged release then
# automatically points at the right place with no file edits needed. If
# it's left unset, builds fall back to the https://your-app.vercel.app
# placeholder already committed in each app's config.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Point the app at the real deployed URL
        if: vars.ALMS_APP_URL != ''
        run: |
          sed -i "s|https://your-app.vercel.app|${{ vars.ALMS_APP_URL }}|" mobile-app/capacitor.config.json

      - name: Install dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Sync Capacitor config into the Android project
        working-directory: mobile-app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile-app/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: alms-android
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Point the app at the real deployed URL
        if: vars.ALMS_APP_URL != ''
        shell: bash
        run: |
          sed -i "s|https://your-app.vercel.app|${{ vars.ALMS_APP_URL }}|" desktop-app/config.json

      - name: Install dependencies
        working-directory: desktop-app
        run: npm ci

      - name: Build Windows installer
        working-directory: desktop-app
        run: npm run build:win

      - uses: actions/upload-artifact@v4
        with:
          name: alms-windows
          path: desktop-app/dist/*.exe

  release:
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename APK for a friendlier download name
        run: mv artifacts/alms-android/app-debug.apk artifacts/alms-android/ALMS.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/alms-android/ALMS.apk
            artifacts/alms-windows/*.exe
