<!DOCTYPE html>
<html lang="en">
<head>

  .icon { width: 72px; height: 72px; border-radius: 20px; background: #FF5A5F; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 24px; font-weight: 900; }

  p { color: #64748B; line-height: 1.6; margin-bottom: 24px; }
  button { background: #FF5A5F; color: #fff; border: none; padding: 12px 28px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
  button:hover { background: #E04B50; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">A</div>
    <h1>You're offline</h1>
